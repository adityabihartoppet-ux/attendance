<!DOCTYPE html>
<html>
<head>
<title>NIELIT Patna Attendance System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
body { 
    font-family: Arial; 
    text-align:center; 
    background:#0acfe1; 
}

h1 { 
    background:#d5ec08; 
    color:black; 
    padding:15px; 
}

table { 
    margin:auto; 
    border-collapse:collapse; 
    width:95%; 
    background:white; 
}

th,td { 
    border:1px solid black; 
    padding:6px; 
    font-size:14px; 
}

button { 
    padding:5px 8px; 
    cursor:pointer; 
    margin:2px;
}

.present { background:lightgreen; font-weight:bold; }
.absent { background:salmon; font-weight:bold; }

.dateBox { 
    margin:15px; 
    font-size:16px; 
}

.summaryBox{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>B.Tech CSE 2026 Attendance<br>NIELIT Patna</h1>

<div class="dateBox">
<label><b>Select Date:</b></label>
<input type="date" id="attendanceDate">
<h3 id="selectedDate"></h3>
</div>

<table id="attendanceTable">
<tr>
<th>Roll No</th>
<th>Registration No</th>
<th>Name</th>
<th>Status</th>
<th>Action</th>
</tr>
</table>

<br>
<button onclick="showSummary()">Show Summary</button>
<button onclick="clearAll()">Clear All</button>
<button onclick="downloadPDF()">Download PDF</button>

<div class="summaryBox" id="summary"></div>

<script>

document.getElementById("attendanceDate").value = today;

"Attendance Date: " + today;

document.getElementById("attendanceDate").addEventListener("change", function(){
    document.getElementById("selectedDate").innerHTML =
    "Attendance Date: " + this.value;
});

[58, "NDU202601383", "SHRISHTI RAJ"]

let table = document.getElementById("attendanceTable");

students.forEach((student, index) => {
    let row = table.insertRow();
    row.insertCell(0).innerHTML = student[0];  
    row.insertCell(1).innerHTML = student[1]; 
    row.insertCell(2).innerHTML = student[2]; 
    row.insertCell(3).innerHTML = "Not Marked";

    let actionCell = row.insertCell(4);
    actionCell.innerHTML =
        "<button onclick='markPresent(this)'>Present</button>" +
        "<button onclick='markAbsent(this)'>Absent</button>" +
        "<button onclick='markRefresh(this)'>Refresh</button>";
});

function markPresent(btn){
    let row = btn.parentElement.parentElement;
    row.cells[3].innerHTML = "Present";
    row.cells[3].className = "present";
}

function markAbsent(btn){
    let row = btn.parentElement.parentElement;
    row.cells[3].innerHTML = "Absent";
    row.cells[3].className = "absent";
}

function markRefresh(btn){
    let row = btn.parentElement.parentElement;
    row.cells[3].innerHTML = "Not Marked";
    row.cells[3].className = "";
}

function showSummary(){
    let present = document.getElementsByClassName("present").length;
    let absent = document.getElementsByClassName("absent").length;
    let total = students.length;

    document.getElementById("summary").innerHTML =
    "Total: " + total + 
    " | Present: " + present + 
    " | Absent: " + absent;
}

function clearAll(){
    let rows = table.rows;
    for(let i=1; i<rows.length; i++){
        rows[i].cells[3].innerHTML = "Not Marked";
        rows[i].cells[3].className = "";
    }
    document.getElementById("summary").innerHTML = "";
}

function downloadPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    let date = document.getElementById("attendanceDate").value;
    
    doc.setFontSize(16);
    doc.text("NIELIT Patna - B.Tech CSE 2026", 105, 15, { align: "center" });
    doc.setFontSize(12);
    doc.text("Attendance Date: " + date, 105, 22, { align: "center" });
    let rowsData = [];
    let tableDOM = document.getElementById("attendanceTable");
    
    for(let i = 1; i < tableDOM.rows.length; i++){
        let roll = tableDOM.rows[i].cells[0].innerText;
        let reg = tableDOM.rows[i].cells[1].innerText;
        let name = tableDOM.rows[i].cells[2].innerText;
        let status = tableDOM.rows[i].cells[3].innerText;
        rowsData.push([roll, reg, name, status]);
    }
    doc.autoTable({
        startY: 30,
        head: [['Roll No', 'Registration No', 'Name', 'Status']],
        body: rowsData,
        theme: 'grid',
        headStyles: { fillColor: [41, 128, 185], textColor: [255, 255, 255] },
        styles: { halign: 'center' },
        didParseCell: function(data) {
            if (data.section === 'body' && data.column.index === 3) {
                if (data.cell.raw === 'Present') {
                    data.cell.styles.fillColor = [144, 238, 144]; 
                    data.cell.styles.fontStyle = 'bold';
                } else if (data.cell.raw === 'Absent') {
                    data.cell.styles.fillColor = [250, 128, 114]; 
                    data.cell.styles.fontStyle = 'bold';
                }
            }
        }
    });
    doc.save("Attendance_" + date + ".pdf");
}
</script>

</body>
</html>
